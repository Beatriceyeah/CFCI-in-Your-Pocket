ms:["Insomnia patients with dysphagia cannot safely swallow melatonin pills or tablets","Dosing melatonin at the right time is hard in any currently available form","Complex medication routines leave patients little control and still waking unrested"],solution:["Wearable controller thermally activates microcapsule stickers at programmed times","Slow, continuous overnight melatonin delivery with caffeine released by morning","Micropill composite platform built to enable a series of transdermal combination products"],edge:["Programmable timed release, unlike passive sleep patches from The Good Patch and Klova","Pill-free alternative to melatonin and prescription hypnotics such as Ambien and trazodone","No FDA-regulated transdermal product exists today for insomnia or circadian regulation"],market:[{label:"TAM",value:"$6.2B/yr",note:"US insomnia and sleep-aid market; 35M Americans use sleep aids regularly"},{label:"Beachhead",value:"$150M+/yr",note:"~150K US nursing home patients with insomnia and dysphagia"}],traction:["Filed provisional patent (DU8987PROV) on microcapsule composites and activation platform","Demonstrated microcapsule encapsulation of small-molecule dyes for thermal release in lab","Designed low-power platform for targeted thermal activation and localized bioavailability"],next:["Secure IP position with Duke OTC ahead of the October 28 non-provisional deadline","Define FDA combination product pathway, timeline and cost with regulatory consultants","Complete a $150K preclinical study milestone to validate transdermal efficacy"],team:[{name:"Student founder 1",role:"PhD, Co-founder"},{name:"Student founder 2",role:"PhD, Co-founder"}],daysSinceUpdate:6,status:"live"},{id:"graphene-hall",ownerIds:["u-tom"],name:"Graphene Hall Sensors",tagline:"Application-specific graphene Hall and quantum Hall modules for precision sensing",pitchProblem:"Researchers and robot builders can't measure magnetic fields precisely where heat, cold or size limit today's sensors.
