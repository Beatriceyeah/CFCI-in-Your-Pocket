CFD during existing right heart catheterizations to build clinician familiarity","Assess workflow patentability and reimbursement pathways used by CFD devices like HeartFlow"],team:[{name:"Student founder 1",role:"PhD Candidate, Biomedical Engineering"}],daysSinceUpdate:11,status:"live"},{id:"clinical-sentinel",name:"Clinical Sentinel",tagline:"A safety gateway that checks clinical AI agents before they touch the EHR",pitchProblem:"Hospitals are rolling out AI agents with no independent check on what they write into the EHR.",pitchSolution:"A site-local gateway that approves, revises or blocks each agent action before it reaches the record.",category:"software",stage:"Prototype",ip:"Architecture defined, no filing yet",summary:"An independent, site-local gateway beside the EHR that checks each proposed agent action against authority, evidence and safety policy before it is committed.",problems:["AI governance leaders must oversee agents from Epic, vendors, and in-house teams at once","No vendor-neutral control point checks agent authority before actions reach the EHR","Manual committee review is slow, labor-intensive, and absent from the real-time action path"],solution:["Normalizes each proposed agent write into a typed clinical action before any EHR effect","Deterministic identity, authority, and safety gates allow, revise, hold, or deny each action","Governability-by-risk registry sets allowable autonomy and records auditable evidence"],edge:["Governs agents where they run, unlike Trase, which imports third-party agents onto Origin","Vendor-neutral authority across Epic, Oracle, Microsoft, and custom-built agents","Clinical action semantics that generic gateways and tools like LangSmith and LiteLLM lack"],market:[{label:"TAM",value:"~$1.0B/yr",note:"5,121 US community hospitals at $200K per site"},{label:"SAM",value:"~$120M",note:"400+ US academic health systems at $300K initial contracts"},{label:"SOM",value:"$4.2M ARR",note:"From 12 paying systems within five y
